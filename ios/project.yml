name: App

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Project.xcconfig
  Release: Config/Project.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"

targetTemplates:
  Extension:
    type: app-extension
    platform: iOS
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Config/AppGroup.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - target: Shared
        embed: false

targets:
  App:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_IDENTIFIER_PREFIX)"
        CODE_SIGN_ENTITLEMENTS: Config/AppGroup.entitlements
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.BackgroundModes:
          enabled: 1
    dependencies:
      - target: Shared
        embed: true
      - target: BroadcastExtension
        embed: true
      - target: KeyboardExtension
        embed: true

  BroadcastExtension:
    templates: [Extension]
    sources:
      - BroadcastExtension/Sources
    settings:
      base:
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_IDENTIFIER_PREFIX).broadcast"
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1

  KeyboardExtension:
    templates: [Extension]
    sources:
      - KeyboardExtension/Sources
    settings:
      base:
        INFOPLIST_FILE: KeyboardExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_IDENTIFIER_PREFIX).keyboard"
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1

  Shared:
    type: framework
    platform: iOS
    sources:
      - Shared/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_IDENTIFIER_PREFIX).shared"
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

schemes:
  App:
    build:
      targets:
        App: all
    run:
      config: Debug
    archive:
      config: Release
